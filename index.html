<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jasper Chapman</title>

  <!-- Font that matches the heavy grotesque look of your Squarespace site -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #0a1a3f;      /* dark blue background */
      --cream: #f4efe5;     /* off-white text */
      --muted: #d8d3c8;     /* softer off-white for body text */
      --line: rgba(244, 239, 229, 0.25);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--navy);
      color: var(--cream);
      font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .wrap { max-width: 1400px; margin: 0 auto; padding: 0 48px; }

    /* ---------- Top navigation ---------- */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 22px;
      border-bottom: 1px solid var(--line);
    }
    nav .brand {
      font-weight: 600;
      font-size: 1.35rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    nav .menu a {
      font-size: 1.1rem;
      margin-left: 40px;
      letter-spacing: 0.01em;
    }
    nav .menu a.active { text-decoration: underline; text-underline-offset: 6px; }

    /* ---------- Hero: headline + description ---------- */
    .hero {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 48px;
      align-items: start;
      padding: 40px 0 44px;
    }
    .hero h1 {
      margin: 0;
      font-weight: 900;
      text-transform: uppercase;
      font-size: clamp(2.6rem, 6.2vw, 5.4rem);
      line-height: 0.98;
      letter-spacing: -0.01em;
    }
    .hero .lede {
      margin: 10px 0 0;
      font-size: clamp(1rem, 1.3vw, 1.25rem);
      line-height: 1.5;
      color: var(--muted);
      max-width: 42ch;
    }

    /* ---------- Hero image ---------- */
    .hero-image {
      width: 100%;
      display: block;
      border-radius: 24px 24px 0 0;   /* rounded top corners like your Squarespace page */
      aspect-ratio: 2768 / 1068;
      object-fit: cover;
    }

    /* ---------- Responsive: stack on phones ---------- */
    @media (max-width: 800px) {
      .wrap { padding: 0 24px; }
      .hero { grid-template-columns: 1fr; gap: 20px; padding: 28px 0; }
      nav .menu a { margin-left: 22px; }
      nav .brand { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- ============ NAV BAR ============ -->
    <nav>
      <a href="index.html" class="brand">Jasper Chapman</a>
      <div class="menu">
        <a href="index.html" class="active">Projects</a>
        <a href="#about">About</a>
      </div>
    </nav>

    <!-- ============ HERO TEXT ============ -->
    <!-- EDIT ME: change the headline and the description below -->
    <section class="hero">
      <h1>Passively Morphing Aerial-Ground Robot</h1>
      <p class="lede">
        A palm-sized robot that flies over obstacles and rolls through tight
        spaces, switching between flight and driving using only its own thrust.
      </p>
    </section>

    <!-- ============ HERO IMAGE ============ -->
    <!-- EDIT ME: this points to the image file named morphable-drone.jpg.
         Upload that image into your repo alongside this file. -->
    <img class="hero-image" src="morphable-drone.jpg"
         alt="Morphable aerial-ground robot on pavement" />

  </div>
</body>
</html>
